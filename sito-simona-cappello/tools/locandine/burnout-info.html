<!doctype html><html lang="it"><head><meta charset="utf-8"><link rel="stylesheet" href="fonts-local.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:939px;height:1645px;overflow:hidden;background:#fff;font-family:Montserrat,sans-serif;color:#333}
.orig{display:block;width:939px;height:1331px}
.band{position:absolute;left:0;right:0;top:1331px;bottom:0;background:#fff;padding:22px 60px 30px}
.line{height:2px;background:#cfdcdc;margin:0 0 22px}
.info{display:grid;grid-template-columns:1.1fr 1fr 170px;gap:16px;height:180px}
.info>div{border-radius:18px;padding:18px 20px}
.info b{display:block;font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;line-height:1.35}
.past{background:#eef4f4}.past b{color:#4f8d8f}
.past ul{list-style:none;margin-top:10px;display:grid;gap:5px}
.past li{font-size:17px;font-weight:700;padding-left:18px;position:relative}
.past li::before{content:"";position:absolute;left:0;top:6px;width:9px;height:9px;border-radius:50%;background:#4f8d8f}
.next{background:#4f8d8f;color:#fff}
.next .big{display:block;font-size:28px;font-weight:800;margin:8px 0 6px}
.next span{display:block;font-size:15px;font-weight:600;line-height:1.4}
.qr{border:2px solid #cfdcdc;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px}
.qr img{width:120px;height:120px}.qr span{color:#2f6f71;font-size:12px;font-weight:700;margin-top:4px;text-align:center}
.foot{margin-top:18px;background:#f4f7f7;border-radius:18px;padding:14px 26px;display:flex;align-items:center;justify-content:space-between;gap:20px;color:#2f6f71}
.foot .lab{font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#4f8d8f}
.foot .it{display:flex;align-items:center;gap:12px}
.foot svg{width:28px;height:28px;fill:#2f6f71;flex:none}
.foot small{display:block;font-size:12px;font-weight:600;color:#7a8f8f}
.foot strong{display:block;font-size:21px;font-weight:800;line-height:1.2}
.mail{margin-top:22px;text-align:center;font-size:17px;color:#2f6f71}.mail strong{font-weight:800}
</style></head><body>
<img class="orig" src="locandina-burnout.jpg" alt="">
<div class="band"><div class="line"></div>
<div class="info">
<div class="past"><b>Già realizzato a<br>[luogo]</b><ul><li>[data]</li><li>[data]</li><li>[data]</li></ul></div>
<div class="next"><b>Prossimo gruppo</b><span class="big">In formazione</span><span>Vuoi farne parte? Per costi, orari e luogo inquadra il QR e scrivimi.</span></div>
<div class="qr"><img src="qr-burnout-teal.svg" alt=""><span>Iscriviti<br>su WhatsApp</span></div>
</div>
<p class="mail">Oppure scrivimi a <strong>simonacappello@gmail.com</strong></p>
</div>
</body></html>
